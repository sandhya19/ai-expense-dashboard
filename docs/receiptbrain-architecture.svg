<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">ReceiptBrain architecture on Alibaba Cloud ECS</title>
  <desc id="description">Users access ReceiptBrain through a public HTTPS domain. Nginx, Next.js, and FastAPI run on Alibaba Cloud ECS. The services use Qwen Cloud and Supabase.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; } .title { font: 700 42px Arial, sans-serif; fill: #0f172a; } .sub { font: 400 20px Arial, sans-serif; fill: #475569; }
      .h { font: 700 25px Arial, sans-serif; fill: #0f172a; } .t { font: 400 18px Arial, sans-serif; fill: #334155; } .s { font: 400 16px Arial, sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; } .ecs { fill: #eef2ff; stroke: #6366f1; stroke-width: 3; } .service { fill: #ffffff; stroke: #818cf8; stroke-width: 2; }
      .qwen { fill: #fff7ed; stroke: #f97316; stroke-width: 3; } .supabase { fill: #ecfdf5; stroke: #10b981; stroke-width: 3; }
      .line { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); } .dash { stroke-dasharray: 9 7; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#475569"/></marker>
  </defs>
  <rect class="bg" width="1600" height="1000"/>
  <text class="title" x="800" y="70" text-anchor="middle">ReceiptBrain — Production Architecture</text>
  <text class="sub" x="800" y="105" text-anchor="middle">Live deployment: receiptbrain.blue-horizon.uk on Alibaba Cloud ECS</text>

  <rect class="box" x="70" y="390" width="235" height="150" rx="20"/>
  <text class="h" x="187" y="445" text-anchor="middle">Users</text>
  <text class="t" x="187" y="480" text-anchor="middle">Browser / HTTPS</text>
  <text class="s" x="187" y="512" text-anchor="middle">Upload receipts · Ask questions</text>

  <rect class="ecs" x="405" y="190" width="760" height="610" rx="28"/>
  <text class="h" x="445" y="240">Alibaba Cloud ECS instance</text>
  <text class="s" x="445" y="270">Public IP → receiptbrain.blue-horizon.uk · TLS termination</text>

  <rect class="service" x="470" y="310" width="630" height="105" rx="16"/>
  <text class="h" x="785" y="355" text-anchor="middle">Nginx reverse proxy</text>
  <text class="t" x="785" y="388" text-anchor="middle">Public HTTPS traffic forwarded to the web application</text>

  <rect class="service" x="470" y="475" width="290" height="235" rx="16"/>
  <text class="h" x="615" y="525" text-anchor="middle">Next.js web app</text>
  <text class="t" x="615" y="560" text-anchor="middle">Frontend + API routes</text>
  <text class="t" x="615" y="592" text-anchor="middle">Auth · dashboard · chat</text>
  <text class="s" x="615" y="635" text-anchor="middle">GET /api/health</text>
  <text class="s" x="615" y="667" text-anchor="middle">Port 3000 (private)</text>

  <rect class="service" x="810" y="475" width="290" height="235" rx="16"/>
  <text class="h" x="955" y="525" text-anchor="middle">FastAPI processor</text>
  <text class="t" x="955" y="560" text-anchor="middle">Receipt OCR + validation</text>
  <text class="t" x="955" y="592" text-anchor="middle">Reprocess + persistence</text>
  <text class="s" x="955" y="635" text-anchor="middle">GET /health</text>
  <text class="s" x="955" y="667" text-anchor="middle">Port 8001 (localhost only)</text>

  <rect class="qwen" x="1265" y="270" width="260" height="185" rx="20"/>
  <text class="h" x="1395" y="323" text-anchor="middle">Qwen Cloud</text>
  <text class="t" x="1395" y="358" text-anchor="middle">Alibaba Model Studio</text>
  <text class="s" x="1395" y="393" text-anchor="middle">Qwen VL OCR</text>
  <text class="s" x="1395" y="421" text-anchor="middle">Qwen reasoning API</text>

  <rect class="supabase" x="1265" y="585" width="260" height="185" rx="20"/>
  <text class="h" x="1395" y="638" text-anchor="middle">Supabase</text>
  <text class="t" x="1395" y="673" text-anchor="middle">Auth · Postgres · Storage</text>
  <text class="s" x="1395" y="708" text-anchor="middle">RLS + private receipt files</text>

  <path class="line" d="M305 465 H465"/>
  <text class="s" x="385" y="447" text-anchor="middle">HTTPS</text>
  <path class="line" d="M785 415 V465"/>
  <path class="line" d="M760 590 H800"/>
  <text class="s" x="782" y="575" text-anchor="middle">private API</text>
  <path class="line" d="M1105 545 C1185 545,1185 365,1260 365"/>
  <text class="s" x="1195" y="430" text-anchor="middle">DashScope API</text>
  <path class="line" d="M760 530 C1090 530,1125 680,1260 680"/>
  <path class="line dash" d="M1105 635 C1180 635,1190 710,1260 710"/>
  <text class="s" x="1180" y="750" text-anchor="middle">data + private storage</text>

  <rect x="70" y="870" width="1460" height="70" rx="14" fill="#e0e7ff"/>
  <text class="t" x="800" y="912" text-anchor="middle">Security boundary: only Nginx is public; application services and secrets stay private on the ECS host.</text>
</svg>
